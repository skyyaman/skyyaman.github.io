name: Update CCTV1 List

on:
  #schedule:  不要使用定时触发，改为手动触发，使用https://console.cron-job.org/触发
  #  - cron: '23 */2 * * *'
  workflow_dispatch: 

# 显式授予写权限
permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Filter Data
        run: |
          mkdir -p txt
          # 1. 确保目标文件存在，如果不存在则初始化
          if [ ! -f txt/cctv.txt ]; then
            echo -e "央视1,#genre#\n\n其他频道,#genre#" > txt/cctv.txt
          fi

          # 2. 动态获取东八区（北京时间）的当天日期
          TARGET_DATE=$(TZ="Asia/Shanghai" date +'%Y%m%d')
          echo "今天的目标日期特征码: msisdn=${TARGET_DATE}"

          # 3. 定义多个抓取网址（用空格隔开）
          URLS=(
            "https://kakaxi.indevs.in/ipv4.txt"
            "https://raw.githubusercontent.com/Supprise0901/TVBox_live/refs/heads/main/live.txt"
            "https://raw.githubusercontent.com/develop202/migu_video/1e94f154f0110063986dcfb1885f71a67adcd7f3/interfaceTXT.txt"
          )

          # 清空上一次的临时文件
          > txt/raw_combined.txt

          # 循环下载所有网址内容并合并
          for url in "${URLS[@]}"; do
            echo "正在下载: $url"
            curl -s --max-time 15 "$url" >> txt/raw_combined.txt || echo "警告: $url 下载失败，跳过。"
          done

          # 4. 过滤数据
          grep -E "http://hlsztemgsplive.miguvideo.com:8080" txt/raw_combined.txt | grep -E "timestamp=${TARGET_DATE}|index.m3u8\?msisdn=${TARGET_DATE}" | \
          awk -F',' '
            {
              if (match($0, /20[0-9]{12}/)) {
                ts = substr($0, RSTART, RLENGTH);
              } else {
                ts = 0;
              }
              
              if (!max_ts[$1] || ts > max_ts[$1]) {
                max_ts[$1] = ts;
                best_line[$1] = $0;
              }
            }
            END {
              for (ch in best_line) print best_line[ch];
            }
          ' | sort -V > txt/new_migu.txt
          
          # 检查过滤出来的行数
          LINE_COUNT=$(wc -l < txt/new_migu.txt)
          echo "过滤去重（仅保留最新时间）并排序后，抓取到今天最新的行数: $LINE_COUNT"
    
          # 5. 如果抓到了内容，执行定位替换
          if [ "$LINE_COUNT" -gt 0 ]; then
            echo "开始替换内容..."
            
            NEXT_GENRE=$(grep ",#genre#" txt/cctv.txt | grep -A 1 "央视1,#genre#" | tail -n 1)
            
            echo "当前分类: 央视1,#genre#"
            echo "下一个分类: $NEXT_GENRE"

            sed -i "/央视1,#genre#/,/$NEXT_GENRE/{ /央视1,#genre#/b; /$NEXT_GENRE/b; d }" txt/cctv.txt
            sed -i "/央视1,#genre#/r txt/new_migu.txt" txt/cctv.txt
            
            rm -f txt/raw_combined.txt txt/new_migu.txt
            echo "更新完成！"
          else
            echo "未抓取到包含今天日期特征码的有效线路，跳过本次更新。"
            rm -f txt/raw_combined.txt txt/new_migu.txt
          fi

      # ----------------- 精简后的 Python 运行步骤 -----------------
      - name: Run Migu Python Script
        run: |
          pip install --disable-pip-version-check requests
          python python/migu.py
      # ------------------------------------------------------------

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add txt/cctv.txt
          
          if git diff --staged --quiet; then
            echo "文件内容与仓库一致，无需提交"
          else
            git commit -m "Auto update cctv.txt at $(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push
          fi